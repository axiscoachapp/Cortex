project_id = "cortex-local"

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/**", "http://127.0.0.1:8080/**"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.process-clinical-notes]
verify_jwt = true

# Public by design: the QR-code validation endpoint is called by pharmacies and
# the ITI validator without any JWT. Access is gated by the patient-held secret
# code inside the function.
[functions.validate-prescription]
verify_jwt = false
