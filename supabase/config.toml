project_id = "cortex-local"

[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/**", "http://127.0.0.1:8080/**"]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.process-clinical-notes]
verify_jwt = true

# Public by design: the QR-code validation endpoint is called by pharmacies and
# the ITI validator without any JWT. Access is gated by the patient-held secret
# code inside the function.
[functions.validate-prescription]
verify_jwt = false

# Public by design: Meta calls the WhatsApp webhook without a JWT. Every delivery is
# authenticated by its X-Hub-Signature-256 HMAC (WHATSAPP_APP_SECRET) inside the function.
[functions.whatsapp-webhook]
verify_jwt = false

# Public by design: pg_cron calls the WhatsApp automations runner with the x-cortex-cron
# shared secret (WHATSAPP_CRON_SECRET), checked inside the function.
[functions.whatsapp-automations]
verify_jwt = false

[functions.signature-maintenance]
verify_jwt = false
